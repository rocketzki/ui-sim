version: '3.8'

services:
  python-gif-generator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./temp:/tmp/gif_generator
    environment:
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
